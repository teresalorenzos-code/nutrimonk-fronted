<title>Nutrimonk — Panel de administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --verde-selva: #0d6a00;
  --verde-profundo: #0a4a00;
  --amarillo-maiz: #ffc800;
  --crema: #fbf6ec;
  --beige: #f0e4c8;
  --beige-claro: #f7eedd;
  --marron-especia: #4a3220;
  --rojo: #b23a2f;
  --azul: #2f6fb2;
  --font-display: "Baloo 2", sans-serif;
  --font-body: "Nunito", sans-serif;
  --radius-sm: 12px;
  --radius-md: 18px;
  --sombra: 0 4px 16px rgba(74,50,32,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--crema); color: var(--marron-especia); }
h1,h2,h3 { font-family: var(--font-display); }

.layout { display: flex; min-height: 100vh; }

.sidebar { width: 220px; flex-shrink: 0; background: var(--verde-profundo); color: var(--beige-claro); padding: 24px 16px; display: flex; flex-direction: column; }
.sidebar-logo { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; margin-bottom: 4px; }
.sidebar-logo .n { color: var(--beige-claro); }
.sidebar-logo .k { color: var(--amarillo-maiz); }
.sidebar-sub { font-size: 0.7rem; opacity: 0.7; margin-bottom: 28px; word-break: break-all; }

.tabs input { display: none; }
.tab-label { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-bottom: 6px; color: var(--beige-claro); opacity: 0.75; }
.tab-label:hover { background: rgba(255,255,255,0.06); opacity: 1; }

#tab-dashboard:checked ~ .layout .lbl-dashboard,
#tab-catalogo:checked ~ .layout .lbl-catalogo,
#tab-pedidos:checked ~ .layout .lbl-pedidos,
#tab-promos:checked ~ .layout .lbl-promos,
#tab-config:checked ~ .layout .lbl-config {
  background: var(--verde-selva); opacity: 1; color: #fff;
}

.panel { display: none; }
#tab-dashboard:checked ~ .layout .panel-dashboard,
#tab-catalogo:checked ~ .layout .panel-catalogo,
#tab-pedidos:checked ~ .layout .panel-pedidos,
#tab-promos:checked ~ .layout .panel-promos { display: block; }
#tab-config:checked ~ .layout .panel-config { display: block; }

.logout-btn { margin-top: auto; background: none; border: 1px solid rgba(255,255,255,0.3); color: var(--beige-claro); padding: 10px; border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-body); font-weight: 700; font-size: 0.8rem; }
.logout-btn:hover { background: rgba(255,255,255,0.08); }

.main { flex: 1; padding: 28px 36px; max-width: 100%; overflow-x: auto; }
.main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
.main-header h1 { font-size: 1.5rem; color: var(--verde-profundo); }
.config-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--beige); gap: 16px; flex-wrap: wrap; }
.config-row:last-child { border-bottom: none; }
.config-label { font-weight: 700; font-size: 0.9rem; }
.config-desc { font-size: 0.8rem; color: #6b5643; }
.config-row input[type="text"], .config-row input[type="number"] { padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd0b8; font-family: var(--font-body); width: 220px; max-width: 100%; }
.toggle-switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: #ddd0b8; border-radius: 999px; cursor: pointer; transition: 0.2s; }
.toggle-slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
.toggle-switch input:checked + .toggle-slider { background: var(--verde-selva); }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
.admin-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0e9da; font-size: 0.85rem; }
.save-bar { display: flex; justify-content: flex-end; margin-top: 16px; }
.admin-chip { background: var(--beige); border-radius: 999px; padding: 8px 16px; font-size: 0.85rem; font-weight: 700; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
.stat-card { background: #fff; border-radius: var(--radius-md); padding: 18px; box-shadow: var(--sombra); }
.stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .03em; color: #8a7660; font-weight: 700; margin-bottom: 6px; }
.stat-value { font-family: var(--font-display); font-size: 1.6rem; color: var(--verde-profundo); }
.stat-delta { font-size: 0.75rem; font-weight: 700; margin-top: 4px; }
.stat-delta.up { color: var(--verde-selva); }
.stat-delta.warn { color: var(--rojo); }

.section-title { font-size: 1.1rem; margin: 24px 0 12px; color: var(--verde-profundo); }
.card { background: #fff; border-radius: var(--radius-md); box-shadow: var(--sombra); padding: 18px; margin-bottom: 20px; }
.empty-msg { color: #8a7660; font-size: 0.85rem; padding: 8px 0; }

table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { text-align: left; padding: 8px 10px; color: #8a7660; font-size: 0.72rem; text-transform: uppercase; border-bottom: 2px solid var(--beige); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid #f0e9da; vertical-align: middle; }
.badge { padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; border: none; cursor: pointer; font-family: var(--font-body); }
.badge.pendiente { background: #fdf0d5; color: #9a6b00; }
.badge.confirmado { background: #dbeadb; color: var(--verde-selva); }
.badge.entregado { background: #dfeaf6; color: var(--azul); }
.badge.bajo { background: #fbe1de; color: var(--rojo); }

.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar-name { width: 160px; font-size: 0.85rem; font-weight: 700; flex-shrink: 0; }
.bar-track { flex: 1; height: 10px; background: var(--beige); border-radius: 6px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--verde-selva); border-radius: 6px; }
.bar-value { width: 60px; text-align: right; font-size: 0.8rem; font-weight: 700; }

.btn { font-family: var(--font-display); font-weight: 700; padding: 10px 18px; border-radius: 999px; border: none; cursor: pointer; font-size: 0.85rem; }
.btn-primary { background: var(--amarillo-maiz); color: var(--verde-profundo); }
.btn-outline { background: #fff; border: 2px solid var(--verde-selva); color: var(--verde-selva); }
.btn-outline.danger { border-color: var(--rojo); color: var(--rojo); }
.btn-sm { padding: 6px 12px; font-size: 0.75rem; }

.filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-row .btn-outline.active { background: var(--verde-selva); color: #fff; }
.catalog-toolbar { margin-bottom: 16px; }
.search-input { width: 100%; max-width: 360px; padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid #ddd0b8; background: #fff; font-family: var(--font-body); font-size: 0.9rem; }
.search-input:focus { outline: 2px solid var(--verde-selva); }

.stock-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.stock-ok { background: var(--verde-selva); }
.stock-out { background: var(--rojo); }

.promo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.promo-card { background: #fff; border-radius: var(--radius-md); box-shadow: var(--sombra); padding: 18px; border-left: 6px solid var(--verde-selva); }
.promo-card h3 { font-size: 1rem; margin-bottom: 6px; }
.promo-card p { font-size: 0.85rem; color: #6b5643; margin-bottom: 10px; }
.promo-tag { display: inline-block; background: var(--beige); padding: 3px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; color: var(--verde-profundo); }

.modal-overlay { position: fixed; inset: 0; background: rgba(74,50,32,0.5); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal-box { background: var(--crema); border-radius: var(--radius-md); padding: 26px; width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto; }
.modal-box h2 { font-size: 1.15rem; color: var(--verde-profundo); margin-bottom: 16px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; }
.field input, .field select { width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid #ddd0b8; background: #fff; font-family: var(--font-body); font-size: 0.9rem; }
.field-check { display: flex; align-items: center; gap: 8px; }
.field-check input { width: auto; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; }
.modal-error { background: #fbe1de; color: var(--rojo); font-size: 0.8rem; padding: 8px 10px; border-radius: 8px; margin-bottom: 12px; display: none; }
.modal-error.show { display: block; }

.note-input { width: 100%; border: 1px solid #ddd0b8; border-radius: 8px; padding: 6px 8px; font-family: var(--font-body); font-size: 0.8rem; background: var(--beige-claro); }

.variante-row { display: grid; grid-template-columns: 1.4fr 0.8fr 0.8fr 0.6fr auto; gap: 6px; align-items: center; margin-bottom: 8px; background: var(--beige-claro); padding: 8px; border-radius: 10px; }
.variante-row input[type="text"], .variante-row input[type="number"] { padding: 7px 8px; border-radius: 8px; border: 1px solid #ddd0b8; font-size: 0.8rem; width: 100%; }
.variante-row input[type="checkbox"] { width: auto; justify-self: center; }
.variante-remove-btn { background: none; border: none; color: var(--rojo); font-size: 1.1rem; cursor: pointer; padding: 4px; }
.variante-row-labels { display: grid; grid-template-columns: 1.4fr 0.8fr 0.8fr 0.6fr auto; gap: 6px; font-size: 0.65rem; text-transform: uppercase; color: #8a7660; font-weight: 700; margin-bottom: 4px; padding: 0 8px; }

@media (max-width: 800px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; flex-direction: row; align-items: center; gap: 6px; padding: 14px; overflow-x: auto; }
  .sidebar-logo, .sidebar-sub, .logout-btn { display: none; }
  .tab-label { margin-bottom: 0; white-space: nowrap; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .promo-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<input type="radio" name="tabs" id="tab-dashboard" checked>
<input type="radio" name="tabs" id="tab-catalogo">
<input type="radio" name="tabs" id="tab-pedidos">

<div class="layout">
  <aside class="sidebar">

  <div class="modal-box" style="max-width: 560px;">

      <div class="field"><label>Nombre</label><input type="text" id="pf-nombre" required /></div>

<script>
const API_BASE_URL = "http://localhost:3000";

const token = sessionStorage.getItem("nutrimonk_admin_token");
const adminEmail = sessionStorage.getItem("nutrimonk_admin_email");

if (!token) {
  window.location.href = "admin-login.html";
}

document.querySelector("#admin-email-label").textContent = adminEmail || "Panel de administrador";

function logout() {
  sessionStorage.removeItem("nutrimonk_admin_token");
  sessionStorage.removeItem("nutrimonk_admin_email");
  window.location.href = "admin-login.html";
}

async function apiFetch(path, options = {}) {
  const response = await fetch(`${API_BASE_URL}${path}`, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${token}`,
      ...(options.headers || {}),
    },
  });

  if (response.status === 401) {
    alert("Tu sesión venció. Iniciá sesión de nuevo.");
    logout();
    throw new Error("Sesión vencida");
  }

  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.error || "Error al comunicarse con el servidor");
  }

  if (response.status === 204) return null;
  return response.json();
}

const money = (n) => `$${Math.round(Number(n)).toLocaleString("es-AR")}`;

async function loadDashboard() {
  const el = document.querySelector("#dashboard-content");
  el.innerHTML = `<p class="empty-msg">Cargando métricas...</p>`;

  try {
    const data = await apiFetch("/api/dashboard");
    const { mes_actual, mes_anterior, productos_mas_vendidos, alertas_stock_bajo } = data;

    const deltaVentas = mes_anterior.ventas > 0
      ? Math.round(((mes_actual.ventas - mes_anterior.ventas) / mes_anterior.ventas) * 100)
      : null;

    const maxUnidades = Math.max(1, ...productos_mas_vendidos.map((p) => p.unidades_vendidas));
    const maxComparativa = Math.max(1, mes_actual.ventas, mes_anterior.ventas);

    el.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Ventas del mes</div>
          <div class="stat-value">${money(mes_actual.ventas)}</div>
          ${deltaVentas !== null ? `<div class="stat-delta ${deltaVentas >= 0 ? "up" : "warn"}">${deltaVentas >= 0 ? "↑" : "↓"} ${Math.abs(deltaVentas)}% vs mes anterior</div>` : `<div class="stat-delta">Sin datos del mes anterior</div>`}
        </div>
        <div class="stat-card">
          <div class="stat-label">Pedidos del mes</div>
          <div class="stat-value">${mes_actual.pedidos}</div>
          <div class="stat-delta">${mes_anterior.pedidos} el mes anterior</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Ticket promedio</div>
          <div class="stat-value">${money(mes_actual.ticket_promedio)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Stock bajo</div>
          <div class="stat-value">${alertas_stock_bajo.length}</div>
          ${alertas_stock_bajo.length > 0 ? `<div class="stat-delta warn">Revisar productos</div>` : `<div class="stat-delta up">Todo en orden</div>`}
        </div>
      </div>

      <h2 class="section-title">Comparativa mes a mes</h2>
      <div class="card">
        <div class="bar-row"><span class="bar-name">Ventas · mes anterior</span><div class="bar-track"><div class="bar-fill" style="width:${(mes_anterior.ventas / maxComparativa) * 100}%; background:var(--beige-claro); border:1px solid var(--verde-selva);"></div></div><span class="bar-value">${money(mes_anterior.ventas)}</span></div>
        <div class="bar-row"><span class="bar-name">Ventas · este mes</span><div class="bar-track"><div class="bar-fill" style="width:${(mes_actual.ventas / maxComparativa) * 100}%"></div></div><span class="bar-value">${money(mes_actual.ventas)}</span></div>
      </div>

      <h2 class="section-title">Productos más vendidos este mes</h2>
      <div class="card">
        ${productos_mas_vendidos.length === 0
          ? `<p class="empty-msg">Todavía no hay ventas este mes.</p>`
          : productos_mas_vendidos.map((p) => `
              <div class="bar-row">
                <span class="bar-name">${p.nombre}</span>
                <div class="bar-track"><div class="bar-fill" style="width:${(p.unidades_vendidas / maxUnidades) * 100}%"></div></div>
                <span class="bar-value">${p.unidades_vendidas} u.</span>
              </div>
            `).join("")}
      </div>

      <h2 class="section-title">Alertas de stock bajo</h2>
      <div class="card">
        ${alertas_stock_bajo.length === 0
          ? `<p class="empty-msg">No hay productos sin stock 🎉</p>`
          : `<table>
              <tr><th>Producto</th><th></th></tr>
              ${alertas_stock_bajo.map((p) => `<tr><td>${p.nombre}</td><td><span class="badge bajo">${p.stock_cantidad === 0 ? "Sin stock" : `${p.stock_cantidad} u. — stock bajo`}</span></td></tr>`).join("")}
            </table>`}
      </div>
    `;
  } catch (err) {
    el.innerHTML = `<p class="empty-msg">No se pudieron cargar las métricas: ${err.message}</p>`;
  }
}

let catalogoCache = [];

async function loadCatalogo() {
  const el = document.querySelector("#catalogo-content");
  el.innerHTML = `<p class="empty-msg">Cargando catálogo...</p>`;

  try {
    const productos = await apiFetch("/api/productos");
    // Orden alfabético por nombre, para que sea fácil ubicar un producto
    // sin tener que scrollear categoría por categoría.
    catalogoCache = productos.sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));

    el.innerHTML = `
      <div class="catalog-toolbar">
        <input type="text" id="catalogo-buscador" class="search-input" placeholder="🔍 Buscar producto o categoría..." />
      </div>
      <div class="card">
        <table>
          <tr><th>Producto</th><th>Categoría</th><th>Presentaciones</th><th>Precios</th><th>Stock total</th><th></th></tr>
          <tbody id="catalogo-tbody"></tbody>
        </table>
      </div>
    `;

    renderCatalogoFilas(catalogoCache);

    document.querySelector("#catalogo-buscador").addEventListener("input", (e) => {
      const texto = e.target.value.trim().toLowerCase();
      const filtrados = catalogoCache.filter(
        (p) => p.nombre.toLowerCase().includes(texto) || p.categoria.toLowerCase().includes(texto)
      );
      renderCatalogoFilas(filtrados);
    });
  } catch (err) {
    el.innerHTML = `<p class="empty-msg">No se pudo cargar el catálogo: ${err.message}</p>`;
  }
}

// Dibuja solo las FILAS de la tabla — separado de loadCatalogo() para
// poder redibujar nada más que esto cada vez que se escribe en el buscador,
// sin tener que volver a pedirle el catálogo entero al servidor.
function renderCatalogoFilas(productos) {
  const tbody = document.querySelector("#catalogo-tbody");
  if (!tbody) return;

  if (productos.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-msg">No se encontró ningún producto con ese nombre.</td></tr>`;
    return;
  }

  tbody.innerHTML = productos.map((p) => {
    const precios = p.variantes.map((v) => v.precio_oferta ?? v.precio);
    const min = Math.min(...precios);
    const max = Math.max(...precios);
    const stockTotal = p.variantes.reduce((sum, v) => sum + v.stock_cantidad, 0);
    const algunaConStock = p.variantes.some((v) => v.stock_disponible);
    return `
      <tr>
        <td>${p.nombre}</td>
        <td>${p.categoria}</td>
        <td>${p.variantes.length} presentación${p.variantes.length === 1 ? "" : "es"}</td>
        <td>${min === max ? money(min) : `${money(min)} – ${money(max)}`}</td>
        <td><span class="stock-dot ${algunaConStock ? "stock-ok" : "stock-out"}"></span>${stockTotal} u.</td>
        <td style="white-space:nowrap;">
          <button class="btn btn-outline btn-sm" onclick="openProductModal(${p.id})">Editar</button>
          <button class="btn btn-outline danger btn-sm" onclick="deleteProduct(${p.id})">Borrar</button>
        </td>
      </tr>
    `;
  }).join("");
}

const productModalEl = document.querySelector("#product-modal");
const productFormEl = document.querySelector("#product-form");
let editingProductId = null;
let varianteRowCount = 0;

// Arma una fila editable para UNA variante dentro del modal. Si viene
// "existente" (con id real), se recuerda ese id para mandar un PUT al
// guardar; si es nueva, se manda como POST.
function addVarianteRow(variante = null) {
  varianteRowCount++;
  const rowId = `v-row-${varianteRowCount}`;
  const list = document.querySelector("#pf-variantes-list");

  const labelsHTML = list.children.length === 0 ? `
    <div class="variante-row-labels">
      <span>Presentación</span><span>Precio</span><span>Oferta</span><span>Stock</span><span></span>
    </div>
  ` : "";

  const rowHTML = `
    ${labelsHTML}
    <div class="variante-row" id="${rowId}" data-variante-id="${variante?.id || ""}">
      <input type="text" placeholder="ej. 500 g" value="${variante?.descripcion || ""}" data-field="descripcion" required />
      <input type="number" min="0" step="1" placeholder="Precio" value="${variante?.precio || ""}" data-field="precio" required />
      <input type="number" min="0" step="1" placeholder="Sin oferta" value="${variante?.precio_oferta ?? ""}" data-field="precio_oferta" />
      <input type="number" min="0" step="1" placeholder="Stock" value="${variante?.stock_cantidad ?? 0}" data-field="stock_cantidad" required />
      <button type="button" class="variante-remove-btn" onclick="document.querySelector('#${rowId}').remove()" aria-label="Quitar presentación">✕</button>
    </div>
  `;

  list.insertAdjacentHTML("beforeend", rowHTML);
}

// Variable donde guardamos la imagen ya lista para mandar al servidor
// (como texto Base64) — arranca vacía y se completa cuando se elige un
// archivo, o con la imagen que el producto ya tenía al editar.
let imagenSeleccionada = null;

// Convierte el archivo elegido en una imagen chica en Base64. No subimos
// el archivo "tal cual" (podría pesar varios MB) — lo redibujamos en un
// canvas más chico y lo comprimimos, así entra cómodo en la base de datos
// y carga rápido en el catálogo.
function procesarImagenSeleccionada(file) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxAncho = 600;
        const escala = Math.min(1, maxAncho / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * escala;
        canvas.height = img.height * escala;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    lector.onerror = reject;
    lector.readAsDataURL(file);
  });
}

document.querySelector("#pf-imagen-file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const hintEl = document.querySelector("#pf-imagen-hint");
  hintEl.textContent = "Procesando imagen...";

  imagenSeleccionada = await procesarImagenSeleccionada(file);

  const previewEl = document.querySelector("#pf-imagen-preview");
  previewEl.src = imagenSeleccionada;
  previewEl.style.display = "block";
  hintEl.textContent = "Esta imagen reemplaza a la anterior al guardar.";
});

function openProductModal(id = null) {
  editingProductId = id;
  document.querySelector("#product-modal-error").classList.remove("show");
  document.querySelector("#pf-variantes-list").innerHTML = "";
  document.querySelector("#pf-imagen-file").value = "";
  document.querySelector("#pf-imagen-hint").textContent = "";

  const previewEl = document.querySelector("#pf-imagen-preview");

  if (id) {
    const p = catalogoCache.find((prod) => prod.id === id);
    document.querySelector("#product-modal-title").textContent = "Editar producto";
    document.querySelector("#pf-nombre").value = p.nombre;
    document.querySelector("#pf-categoria").value = p.categoria;
    imagenSeleccionada = p.imagen_url || null;
    if (imagenSeleccionada) {
      previewEl.src = imagenSeleccionada;
      previewEl.style.display = "block";
    } else {
      previewEl.style.display = "none";
    }
    p.variantes.forEach((v) => addVarianteRow(v));
  } else {
    document.querySelector("#product-modal-title").textContent = "Nuevo producto";
    productFormEl.reset();
    imagenSeleccionada = null;
    previewEl.style.display = "none";
    addVarianteRow(); // arranca con una fila vacía para completar
  }

  productModalEl.classList.add("open");
}

function closeProductModal() {
  productModalEl.classList.remove("open");
}

productFormEl.addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.querySelector("#product-modal-error");
  errorEl.classList.remove("show");

  const filasVariantes = Array.from(document.querySelectorAll(".variante-row"));
  if (filasVariantes.length === 0) {
    errorEl.textContent = "Agregá al menos una presentación.";
    errorEl.classList.add("show");
    return;
  }

  const leerFila = (row) => ({
    id: row.dataset.varianteId || null,
    descripcion: row.querySelector('[data-field="descripcion"]').value,
    precio: Number(row.querySelector('[data-field="precio"]').value),
    precio_oferta: row.querySelector('[data-field="precio_oferta"]').value
      ? Number(row.querySelector('[data-field="precio_oferta"]').value)
      : null,
    stock_cantidad: Number(row.querySelector('[data-field="stock_cantidad"]').value),
  });

  const datosGenerales = {
    nombre: document.querySelector("#pf-nombre").value,
    categoria: document.querySelector("#pf-categoria").value,
    imagen_url: imagenSeleccionada,
  };

  try {
    if (editingProductId) {
      // 1) Actualizar los datos generales del producto.
      await apiFetch(`/api/productos/${editingProductId}`, { method: "PUT", body: JSON.stringify(datosGenerales) });

      // 2) Cada fila de variante: si ya tenía id, se edita (PUT);
      //    si es nueva (sin id), se crea (POST).
      for (const row of filasVariantes) {
        const datos = leerFila(row);
        if (datos.id) {
          await apiFetch(`/api/productos/variantes/${datos.id}`, { method: "PUT", body: JSON.stringify(datos) });
        } else {
          await apiFetch(`/api/productos/${editingProductId}/variantes`, { method: "POST", body: JSON.stringify(datos) });
        }
      }

      // 3) Las variantes que existían antes pero ya no están en el
      //    formulario (se borraron con el botón ✕) se ocultan en el servidor.
      const idsActuales = filasVariantes.map((row) => row.dataset.varianteId).filter(Boolean);
      const producto = catalogoCache.find((p) => p.id === editingProductId);
      const idsBorrados = producto.variantes.map((v) => String(v.id)).filter((id) => !idsActuales.includes(id));
      for (const id of idsBorrados) {
        await apiFetch(`/api/productos/variantes/${id}`, { method: "DELETE" });
      }
    } else {
      // Producto nuevo: se manda todo junto (el servidor crea el
      // producto y sus variantes en una sola operación).
      const payload = { ...datosGenerales, variantes: filasVariantes.map(leerFila) };
      await apiFetch("/api/productos", { method: "POST", body: JSON.stringify(payload) });
    }

    closeProductModal();
    loadCatalogo();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add("show");
  }
});

async function deleteProduct(id) {
  if (!confirm("¿Seguro que querés borrar este producto? Va a dejar de verse en la tienda.")) return;
  try {
    await apiFetch(`/api/productos/${id}`, { method: "DELETE" });
    loadCatalogo();
  } catch (err) {
    alert("No se pudo borrar: " + err.message);
  }
}

let pedidosFiltroActual = "";

async function loadPedidos(estado = pedidosFiltroActual) {
  pedidosFiltroActual = estado;
  document.querySelectorAll("#pedidos-filtros button").forEach((b) => {
    b.classList.toggle("active", b.dataset.estado === estado);
  });

  const el = document.querySelector("#pedidos-content");
  el.innerHTML = `<p class="empty-msg">Cargando pedidos...</p>`;

  try {
    const query = estado ? `?estado=${estado}` : "";
    const pedidos = await apiFetch(`/api/pedidos${query}`);

    if (pedidos.length === 0) {
      el.innerHTML = `<p class="empty-msg">No hay pedidos ${estado ? `en estado "${estado}"` : "todavía"}.</p>`;
      return;
    }

    el.innerHTML = `
      <div class="card">
        <table>
          <tr><th>N° pedido</th><th>Cliente</th><th>Dirección</th><th>Total</th><th>Pago</th><th>Estado</th><th>Nota interna</th></tr>
          ${pedidos.map((p) => `
            <tr>
              <td>${p.numero_pedido}</td>
              <td>${p.nombre_entrega}<br><span style="color:#8a7660;font-size:0.75rem;">${p.telefono_entrega}</span></td>
              <td>${p.direccion}, ${p.localidad}</td>
              <td>${money(p.total)}</td>
              <td>${p.metodo_pago === "mercado_pago" ? "Mercado Pago" : "Efectivo"}</td>
              <td>
                <select class="badge ${p.estado}" onchange="updateEstado(${p.id}, this.value)">
                  <option value="pendiente" ${p.estado === "pendiente" ? "selected" : ""}>Pendiente</option>
                  <option value="confirmado" ${p.estado === "confirmado" ? "selected" : ""}>Confirmado</option>
                  <option value="entregado" ${p.estado === "entregado" ? "selected" : ""}>Entregado</option>
                </select>
              </td>
              <td>
                <input class="note-input" value="${p.nota_interna || ""}" placeholder="Sin notas"
                  onchange="updateNota(${p.id}, this.value)" />
              </td>
            </tr>
          `).join("")}
        </table>
      </div>
    `;
  } catch (err) {
    el.innerHTML = `<p class="empty-msg">No se pudieron cargar los pedidos: ${err.message}</p>`;
  }
}

document.querySelectorAll("#pedidos-filtros button").forEach((btn) => {
  btn.addEventListener("click", () => loadPedidos(btn.dataset.estado));
});

async function updateEstado(id, estado) {
  try {
    await apiFetch(`/api/pedidos/${id}`, { method: "PATCH", body: JSON.stringify({ estado }) });
    loadPedidos();
  } catch (err) {
    alert("No se pudo actualizar el estado: " + err.message);
  }
}

async function updateNota(id, nota_interna) {
  try {
    await apiFetch(`/api/pedidos/${id}`, { method: "PATCH", body: JSON.stringify({ nota_interna }) });
  } catch (err) {
    alert("No se pudo guardar la nota: " + err.message);
  }
}

async function loadPromos() {
  const el = document.querySelector("#promos-content");
  el.innerHTML = `<p class="empty-msg">Cargando promociones...</p>`;

  try {
    const promos = await apiFetch("/api/promociones");

    el.innerHTML = promos.length === 0
      ? `<p class="empty-msg">Todavía no hay promociones activas.</p>`
      : `<div class="promo-grid">
          ${promos.map((promo) => `
            <div class="promo-card">
              <span class="promo-tag">${promo.tipo === "porcentaje" ? "% Descuento" : "Precio fijo"}</span>
              <h3>${promo.producto_nombre} — ${promo.variante_descripcion}</h3>
              <p>${promo.tipo === "porcentaje" ? `${promo.valor}% de descuento` : `Precio promocional: ${money(promo.valor)}`}
                 · vigente del ${promo.vigente_desde.slice(0,10)} al ${promo.vigente_hasta.slice(0,10)}</p>
              <button class="btn btn-outline danger btn-sm" onclick="deletePromo(${promo.id})">Terminar promoción</button>
            </div>
          `).join("")}
        </div>`;
  } catch (err) {
    el.innerHTML = `<p class="empty-msg">No se pudieron cargar las promociones: ${err.message}</p>`;
  }
}

const promoModalEl = document.querySelector("#promo-modal");
const promoFormEl = document.querySelector("#promo-form");

async function openPromoModal() {
  document.querySelector("#promo-modal-error").classList.remove("show");
  promoFormEl.reset();

  if (catalogoCache.length === 0) {
    catalogoCache = await apiFetch("/api/productos");
  }

  const select = document.querySelector("#pm-producto");
  select.innerHTML = catalogoCache
    .flatMap((p) => p.variantes.map((v) => `<option value="${v.id}">${p.nombre} — ${v.descripcion}</option>`))
    .join("");

  promoModalEl.classList.add("open");
}

function closePromoModal() {
  promoModalEl.classList.remove("open");
}

document.querySelector("#pm-tipo").addEventListener("change", (e) => {
  document.querySelector("#pm-valor-label").textContent =
    e.target.value === "porcentaje" ? "Valor (%)" : "Precio promocional ($)";
});

promoFormEl.addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.querySelector("#promo-modal-error");
  errorEl.classList.remove("show");

  const payload = {
    variante_id: Number(document.querySelector("#pm-producto").value),
    tipo: document.querySelector("#pm-tipo").value,
    valor: Number(document.querySelector("#pm-valor").value),
    vigente_desde: document.querySelector("#pm-desde").value,
    vigente_hasta: document.querySelector("#pm-hasta").value,
  };

  try {
    await apiFetch("/api/promociones", { method: "POST", body: JSON.stringify(payload) });
    closePromoModal();
    loadPromos();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add("show");
  }
});

async function deletePromo(id) {
  if (!confirm("¿Terminar esta promoción ahora?")) return;
  try {
    await apiFetch(`/api/promociones/${id}`, { method: "DELETE" });
    loadPromos();
  } catch (err) {
    alert("No se pudo eliminar: " + err.message);
  }
}

  try {
    const [config, admins] = await Promise.all([
      apiFetch("/api/configuracion"),
      apiFetch("/api/administradores"),
    ]);

    el.innerHTML = `
      <div class="card">
        <div class="config-row">
          <div>
            <div class="config-label">Pausar la tienda</div>
            <div class="config-desc">Mientras esté pausada, la web no deja completar nuevos pedidos</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="cf-pausada" ${config.tienda_pausada ? "checked" : ""} />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="config-row">
          <div>
            <div class="config-label">Avisar de pedidos nuevos</div>
            <div class="config-desc">Reservado para cuando sumemos notificaciones (próximamente)</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="cf-notificar" ${config.notificar_pedido_nuevo ? "checked" : ""} />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="config-row">
          <div>
            <div class="config-label">Umbral de stock bajo</div>
            <div class="config-desc">A partir de cuántas unidades el dashboard avisa "stock bajo"</div>
          </div>
          <input type="number" id="cf-umbral" min="0" value="${config.alerta_stock_bajo_umbral}" />
        </div>
        <div class="config-row">
          <div>
            <div class="config-label">WhatsApp de contacto</div>
            <div class="config-desc">Con código de país, sin "+" (ej. 5493534085467)</div>
          </div>
          <input type="text" id="cf-whatsapp" value="${config.whatsapp_numero}" />
        </div>
        <div class="config-row">
          <div>
            <div class="config-label">Texto de envíos</div>
            <div class="config-desc">Se muestra en el pie de página de la tienda</div>
          </div>
          <input type="text" id="cf-envio" value="${config.envio_texto}" style="width:280px;" />
        </div>
        <div class="save-bar">
          <button class="btn btn-primary" onclick="saveConfig()">Guardar cambios</button>
        </div>
      </div>

      <h2 class="section-title">Administradores</h2>
      <div class="card">
        ${admins.map((a) => `
          <div class="admin-row">
            <span>${a.email}</span>
            <button class="btn btn-outline danger btn-sm" onclick="deleteAdmin(${a.id})">Quitar acceso</button>
          </div>
        `).join("")}
        <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
          <input type="text" id="na-email" placeholder="Email del nuevo administrador" style="flex:1;min-width:180px;padding:8px 10px;border-radius:8px;border:1px solid #ddd0b8;" />
          <input type="password" id="na-password" placeholder="Contraseña (mín. 6 caracteres)" style="flex:1;min-width:180px;padding:8px 10px;border-radius:8px;border:1px solid #ddd0b8;" />
          <button class="btn btn-primary btn-sm" onclick="addAdmin()">+ Invitar</button>
        </div>
      </div>
    `;
  } catch (err) {
    el.innerHTML = `<p class="empty-msg">No se pudo cargar la configuración: ${err.message}</p>`;
  }
}

async function saveConfig() {
  try {
    await apiFetch("/api/configuracion", {
      method: "PUT",
      body: JSON.stringify({
        tienda_pausada: document.querySelector("#cf-pausada").checked,
        notificar_pedido_nuevo: document.querySelector("#cf-notificar").checked,
        alerta_stock_bajo_umbral: Number(document.querySelector("#cf-umbral").value),
        whatsapp_numero: document.querySelector("#cf-whatsapp").value,
        envio_texto: document.querySelector("#cf-envio").value,
      }),
    });
    alert("Configuración guardada.");
  } catch (err) {
    alert("No se pudo guardar: " + err.message);
  }
}

async function addAdmin() {
  const email = document.querySelector("#na-email").value;
  const password = document.querySelector("#na-password").value;
  if (!email || !password) return alert("Completá email y contraseña.");

  try {
    await apiFetch("/api/administradores", { method: "POST", body: JSON.stringify({ email, password }) });
    loadConfig();
  } catch (err) {
    alert("No se pudo invitar: " + err.message);
  }
}

async function deleteAdmin(id) {
  if (!confirm("¿Quitarle el acceso a este administrador?")) return;
  try {
    await apiFetch(`/api/administradores/${id}`, { method: "DELETE" });
    loadConfig();
  } catch (err) {
    alert("No se pudo quitar: " + err.message);
  }
}
