<title>Nutrimonk — Ingreso administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --verde-selva: #0d6a00;
    --verde-profundo: #0a4a00;
    --amarillo-maiz: #ffc800;
    --crema: #fbf6ec;
    --beige: #f0e4c8;
    --marron-especia: #4a3220;
    --rojo: #b23a2f;
    --font-display: "Baloo 2", sans-serif;
    --font-body: "Nunito", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: linear-gradient(180deg, var(--verde-selva), var(--verde-profundo));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--crema);
    border-radius: 22px;
    padding: 36px 32px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }
  .login-title { font-family: var(--font-display); font-size: 1.4rem; color: var(--verde-profundo); margin-bottom: 4px; text-align: center; }
  .login-sub { font-size: 0.85rem; color: #6b5643; text-align: center; margin-bottom: 24px; }
  label { font-size: 0.8rem; font-weight: 700; color: var(--marron-especia); display: block; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #ddd0b8;
    background: #fff; font-family: var(--font-body); font-size: 0.95rem; margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--verde-selva); }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 999px;
    background: var(--amarillo-maiz); color: var(--verde-profundo);
    font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-msg { background: #fbe1de; color: var(--rojo); font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; margin-bottom: 16px; display: none; }
  .error-msg.show { display: block; }
  .success-msg { background: #dbeadb; color: var(--verde-selva); font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; margin-top: 16px; display: none; }
  .success-msg.show { display: block; }
</style>
</head>
<body>

  <div class="login-card">
    <div class="login-title">Panel de administrador</div>
    <div class="login-sub">Nutrimonk</div>

    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg">✅ Ingreso correcto. Sesión guardada.</div>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username" />

      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password" />

      <button type="submit" id="submit-btn">Ingresar</button>
    </form>
  </div>

<script>
  // Misma URL que usa el resto de la web para hablarle al backend.
  const API_BASE_URL = "https://nutrimonk-web.onrender.com";

  const form = document.querySelector("#login-form");
  const errorEl = document.querySelector("#error-msg");
  const successEl = document.querySelector("#success-msg");
  const submitBtn = document.querySelector("#submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault(); // evita que el formulario recargue la página

    errorEl.classList.remove("show");
    successEl.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Ingresando...";

    const email = document.querySelector("#email").value;
    const password = document.querySelector("#password").value;

    try {
      const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "No se pudo iniciar sesión");
      }

      // sessionStorage: el token vive mientras la pestaña esté abierta.
      // Se guarda en el navegador, nunca en el código de la página.
      sessionStorage.setItem("nutrimonk_admin_token", data.token);
      sessionStorage.setItem("nutrimonk_admin_email", data.email);

      successEl.classList.add("show");
      submitBtn.textContent = "¡Listo!";
      // Pequeña pausa para que se alcance a ver el mensaje de éxito
      // antes de saltar a la siguiente pantalla.
      setTimeout(() => {
        window.location.href = "admin.html";
      }, 500);
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add("show");
      submitBtn.disabled = false;
      submitBtn.textContent = "Ingresar";
    }
  });
</script>
</body>
</html>
